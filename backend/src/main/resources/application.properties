# ===================================================================
# Smart Parking Availability Platform - Spring Boot Configuration
# ===================================================================
spring.application.name=smart-parking-backend
server.port=8080

# Active Profile: 'oracle' (default for Oracle DB) - change to 'h2' only if H2 JAR is available
spring.profiles.active=oracle

# Spring MVC / Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Actuator & Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.smartparking.platform=DEBUG
logging.level.org.hibernate.SQL=INFO
