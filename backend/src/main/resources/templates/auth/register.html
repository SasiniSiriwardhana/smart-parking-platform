<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SmartPark</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { display: flex; align-items: flex-start; justify-content: center; min-height: 100vh; padding: 2rem 1rem; }
        .auth-card { width: 100%; max-width: 500px; }
    </style>
</head>
<body>

<div class="auth-card">
    <div style="text-align: center; margin-bottom: 2rem;">
        <a th:href="@{/}" style="display: inline-flex; align-items: center; gap: 0.75rem; text-decoration: none; color: #fff; font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem;">
            <div class="logo-badge">P</div>
            Smart<span class="gradient-text">Park</span>
        </a>
        <h2 style="font-size: 1.5rem; margin-bottom: 0.35rem;">Create Driver Account</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Join the smart urban mobility platform</p>
    </div>

    <div class="glass-panel" style="padding: 2rem;">

        <div th:if="${errorMessage}" class="alert alert-danger" style="margin-bottom: 1.25rem;">
            <i class="ph ph-warning-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/register}" method="post" th:object="${userDto}">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <!-- Username -->
                <div>
                    <label style="display: block; font-size: 0.83rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-muted);">Username *</label>
                    <input type="text" th:field="*{username}" class="form-input" placeholder="alex_perera" required>
                    <div th:if="${#fields.hasErrors('username')}" style="color: #fb7185; font-size: 0.78rem; margin-top: 0.3rem;" th:errors="*{username}"></div>
                </div>

                <!-- Full Name -->
                <div>
                    <label style="display: block; font-size: 0.83rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-muted);">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-input" placeholder="Alex Perera">
                </div>
            </div>

            <!-- Email -->
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.83rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-muted);">Email Address *</label>
                <div style="position: relative;">
                    <i class="ph ph-envelope" style="position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--text-dim);"></i>
                    <input type="email" th:field="*{email}" class="form-input" style="padding-left: 2.5rem;" placeholder="alex@example.com" required>
                </div>
                <div th:if="${#fields.hasErrors('email')}" style="color: #fb7185; font-size: 0.78rem; margin-top: 0.3rem;" th:errors="*{email}"></div>
            </div>

            <!-- Password -->
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.83rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-muted);">Password * (min. 6 characters)</label>
                <div style="position: relative;">
                    <i class="ph ph-lock" style="position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--text-dim);"></i>
                    <input type="password" th:field="*{password}" class="form-input" style="padding-left: 2.5rem;" placeholder="••••••••" required>
                </div>
                <div th:if="${#fields.hasErrors('password')}" style="color: #fb7185; font-size: 0.78rem; margin-top: 0.3rem;" th:errors="*{password}"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                <!-- Phone -->
                <div>
                    <label style="display: block; font-size: 0.83rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-muted);">Phone Number</label>
                    <input type="text" th:field="*{phoneNumber}" class="form-input" placeholder="+94 77 123 4567">
                </div>

                <!-- Vehicle Number -->
                <div>
                    <label style="display: block; font-size: 0.83rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-muted);">Vehicle Plate</label>
                    <input type="text" th:field="*{vehicleNumber}" class="form-input" placeholder="CAB-4589">
                </div>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1rem;">
                <i class="ph ph-user-plus"></i> Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account?
            <a th:href="@{/login}" style="color: #38bdf8; font-weight: 600; text-decoration: none;">Sign in here &rarr;</a>
        </div>

    </div>
</div>

</body>
</html>
